<VirtualHost *:80>
    ServerName nimbusmotos.com
    ServerAlias www.nimbusmotos.com
    DocumentRoot /var/www/html/nimbusmotos

    <Directory /var/www/html/nimbusmotos>
        AllowOverride All
    </Directory>

    ErrorLog /var/log/apache2/moto_error.log
    CustomLog /var/log/apache2/moto_access.log combined
</VirtualHost>

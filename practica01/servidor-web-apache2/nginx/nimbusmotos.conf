server {
    listen 80;
    listen [::]:80;
    server_name nimbusmotos.com www.nimbusmotos.com;

    root /var/www/nimbusmotos;
    index index.html;

    access_log /var/log/nginx/motos_access.log;
    error_log /var/log/nginx/motos_error.log;
    location / {
        try_files $uri $uri/ =404;
    }
}
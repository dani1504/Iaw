server {
    listen 80;
    listen [::]:80;
    server_name nimbuscoches.com www.nimbuscoches.com;

    root /var/www/nimbuscoches;
    index index.html;

    access_log /var/log/nginx/coches_access.log;
    error_log /var/log/nginx/coches_error.log;
    location / {
        try_files $uri $uri/ =404;
    }
}